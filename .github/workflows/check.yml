name: Flake check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Evaluation only: the runner is x86_64-linux and cannot build the
      # aarch64-darwin closures, but it can still typecheck every host and
      # run the treefmt formatting check.
      - run: nix flake check --all-systems --no-build
