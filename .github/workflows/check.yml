name: Flake check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Evaluation only: the runner is x86_64-linux and cannot build the
      # aarch64-darwin closures. This covers nixbox and the flake's own
      # outputs; `nix flake check` has no handler for darwinConfigurations, so
      # macbook is named in the output list but never evaluated.
      - run: nix flake check --all-systems --no-build
